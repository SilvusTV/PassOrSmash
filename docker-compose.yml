services:
  minio:
    image: minio/minio:latest
    container_name: passorsmash-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: passorsmash
      MINIO_ROOT_PASSWORD: passorsmash-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 passorsmash passorsmash-local-secret; do sleep 2; done;
      mc mb --ignore-existing local/passorsmash-images;
      mc anonymous set download local/passorsmash-images;
      "

volumes:
  minio_data:
