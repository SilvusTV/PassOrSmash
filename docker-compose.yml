services:
  postgres:
    image: postgres:17-alpine
    container_name: passorsmash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: passorsmash
      POSTGRES_PASSWORD: passorsmash-local-secret
      POSTGRES_DB: passorsmash
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U passorsmash -d passorsmash']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: passorsmash-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: passorsmash
      MINIO_ROOT_PASSWORD: passorsmash-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 passorsmash passorsmash-local-secret; do sleep 2; done;
      mc mb --ignore-existing local/passorsmash-images;
      mc anonymous set download local/passorsmash-images;
      "

volumes:
  postgres_data:
  minio_data:
